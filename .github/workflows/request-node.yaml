name: request-node

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the @requestnetwork/request-node NPM package to fetch (latest|next|version)
        default: next
        required: true
      image_tag:
        description: Optional Docker tag for a runtime-only rebuild (leaves package-version tags unchanged)
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: npm-version
        run: echo "version=$(npm show @requestnetwork/request-node@${{ github.event.inputs.version }} version)" >> $GITHUB_OUTPUT
      - name: Select image tags
        id: image-tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PACKAGE_VERSION: ${{ steps.npm-version.outputs.version }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$IMAGE_TAG" ]; then
            if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker image tag" >&2
              exit 1
            fi
            echo "tags=requestnetwork/request-node:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tags=requestnetwork/request-node:$PACKAGE_VERSION,requestnetwork/request-node:$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          context: request-node
          platforms: linux/amd64,linux/arm64
          build-args: REQUEST_NODE_VERSION=${{ steps.npm-version.outputs.version }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/RequestNetwork/docker-images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
